services:
  - type: web
    name: ai-research-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.4'
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: ai_research_assistant
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: CORS_ORIGINS
        value: '["http://localhost:5173", "https://ai-research-assistant-peach.vercel.app"]'
